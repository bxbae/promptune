spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/promptune}
    username: ${SPRING_DATASOURCE_USERNAME:promptune}
    password: ${SPRING_DATASOURCE_PASSWORD:promptune}
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 관리
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: [profile, email]
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-client-secret}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE:http://localhost:8080}/login/oauth2/code/naver"
            scope: [name, email]
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-client-secret}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE:http://localhost:8080}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            scope: [profile_nickname, account_email]
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id


ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

app:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      documents-bucket: ${AWS_S3_DOCUMENTS_BUCKET:promptune-document}

jwt:
  secret: ${JWT_SECRET:promptune-dev-secret-key-change-in-production-please}
  expiration-ms: 86400000

server:
  port: 8080
  # Nginx가 앞단에서 TLS를 종료하고 내부(http)로 프록시하기 때문에, Spring이
  # X-Forwarded-Proto/Host 헤더를 신뢰해서 https 기준으로 리다이렉트 URL을 만들도록 설정.
  # 이게 없으면 구글 로그인(redirect-uri를 {baseUrl}로 자동 생성)이 http://로 잘못 만들어져서
  # "redirect_uri_mismatch" 에러가 남.
  forward-headers-strategy: framework


microsoft:
  client-id: ${MICROSOFT_CLIENT_ID:}
  client-secret: ${MICROSOFT_CLIENT_SECRET:}
  tenant: ${MICROSOFT_TENANT:common}
  redirect-uri: ${MICROSOFT_REDIRECT_URI:http://localhost:8080/api/integrations/microsoft/callback}
  frontend-url: ${MICROSOFT_FRONTEND_URL:http://localhost:3000}
  token-key: ${MICROSOFT_TOKEN_KEY:}
