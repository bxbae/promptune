name: CI

# 언제 실행되나: main 푸시 + 모든 PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- AI 서비스 (FastAPI) ----------
  ai-service:
    name: AI Service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: import·기동 검증
        run: python -c "from app.main import app; print('FastAPI app OK')"
      - name: 엔드포인트 스모크 테스트
        run: |
          pip install httpx
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get('/health').json()['status'] == 'ok'
          r = c.post('/api/ai/diagnose', json={'text': '휴가 신청서 작성해줘'})
          assert r.json()['task_type'] == 'application'
          assert r.json()['needs_internal_docs'] is True
          print('AI 스모크 테스트 통과')
          "

  # ---------- 백엔드 (Spring Boot) ----------
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
      - name: 컴파일 검증
        run: gradle compileJava --no-daemon

  # ---------- 프론트 (Next.js) ----------
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 의존성 설치
        run: npm install
      - name: 타입 체크
        run: npx tsc --noEmit
      - name: 빌드
        run: npm run build

  # ---------- Docker Compose 통합 검증 ----------
  docker-build:
    name: Docker 빌드 검증
    runs-on: ubuntu-latest
    needs: [ai-service, backend, frontend]   # 위 3개 통과 후에만
    steps:
      - uses: actions/checkout@v4
      - name: compose 파일 문법 검증
        run: docker compose config
      - name: 이미지 빌드 (기동 없이 빌드만)
        run: docker compose build
