# PrompTune 배포용 (EC2 + RDS)
# 로컬 db 없음 → AWS RDS 연결
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  ai-service:
    build: ./ai-service
    environment:
      USE_REAL_MODELS: "${USE_REAL_MODELS:-false}"
      USE_REAL_DIAGNOSIS: "${USE_REAL_DIAGNOSIS:-false}"
      AI_DIAGNOSIS_MODEL_PATH: /app/models/prompt-diagnosis
      AI_DIAGNOSIS_DEVICE: "cpu"
      USE_REAL_SPELLCHECK: "${USE_REAL_SPELLCHECK:-false}"
      BAREUN_API_KEY: "${BAREUN_API_KEY:-}"
      USE_REAL_SUGGESTION: "${USE_REAL_SUGGESTION:-false}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./ai-service/models/prompt-diagnosis:/app/models/prompt-diagnosis:ro
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      AI_SERVICE_URL: http://ai-service:8000
      APP_FRONTEND_URL: "${APP_FRONTEND_URL}"
      APP_CORS_ORIGINS: "${APP_CORS_ORIGINS}"
      JWT_SECRET: "${JWT_SECRET}"
      OAUTH_REDIRECT_BASE: "${OAUTH_REDIRECT_BASE}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      KAKAO_CLIENT_ID: "${KAKAO_CLIENT_ID:-}"
      KAKAO_CLIENT_SECRET: "${KAKAO_CLIENT_SECRET:-}"
      NAVER_CLIENT_ID: "${NAVER_CLIENT_ID:-}"
      NAVER_CLIENT_SECRET: "${NAVER_CLIENT_SECRET:-}"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_S3_DOCUMENTS_BUCKET: "${AWS_S3_DOCUMENTS_BUCKET:-promptune-document}"
    ports:
      - "8080:8080"
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx 리버스 프록시 + HTTPS(Let's Encrypt) 종료. 최초 인증서 발급은
  # scripts/init-letsencrypt.sh 로 한 번 해줘야 함 (docs/EC2_배포_가이드.md 5-2절 참고).
  nginx:
    image: nginx:1.27-alpine
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # 12시간마다 인증서 만료 임박 여부 체크 후 자동 갱신 (webroot 방식이라 nginx 무중단).
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

volumes:
  hf_cache:
