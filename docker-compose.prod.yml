# PrompTune 배포용 (EC2 + RDS)
# 로컬 db 없음 → AWS RDS 연결
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  ai-service:
    build: ./ai-service
    environment:
      USE_REAL_MODELS: "${USE_REAL_MODELS:-false}"
      USE_REAL_DIAGNOSIS: "${USE_REAL_DIAGNOSIS:-false}"
      AI_DIAGNOSIS_MODEL_PATH: /app/models/prompt-diagnosis
      AI_DIAGNOSIS_DEVICE: "cpu"
      USE_REAL_SPELLCHECK: "${USE_REAL_SPELLCHECK:-false}"
      BAREUN_API_KEY: "${BAREUN_API_KEY:-}"
      USE_REAL_SUGGESTION: "${USE_REAL_SUGGESTION:-false}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./ai-service/models/prompt-diagnosis:/app/models/prompt-diagnosis:ro
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      AI_SERVICE_URL: http://ai-service:8000
      APP_FRONTEND_URL: "${APP_FRONTEND_URL}"
      APP_CORS_ORIGINS: "${APP_CORS_ORIGINS}"
      JWT_SECRET: "${JWT_SECRET}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      KAKAO_CLIENT_ID: "${KAKAO_CLIENT_ID:-}"
      KAKAO_CLIENT_SECRET: "${KAKAO_CLIENT_SECRET:-}"
      NAVER_CLIENT_ID: "${NAVER_CLIENT_ID:-}"
      NAVER_CLIENT_SECRET: "${NAVER_CLIENT_SECRET:-}"
    ports:
      - "8080:8080"
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf_cache:
