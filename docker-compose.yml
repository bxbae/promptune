# PrompTune 전체 스택
# db(healthy) → ai-service/backend → frontend

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: promptune
      POSTGRES_USER: promptune
      POSTGRES_PASSWORD: promptune
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptune"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./ai-service
    environment:
      USE_REAL_MODELS: "false"
      USE_REAL_DIAGNOSIS: "${USE_REAL_DIAGNOSIS:-false}"
      AI_DIAGNOSIS_MODEL_PATH: /app/models/prompt-diagnosis
      AI_DIAGNOSIS_MAX_LENGTH: "128"
      AI_DIAGNOSIS_DEVICE: "cpu"
      USE_REAL_SPELLCHECK: "${USE_REAL_SPELLCHECK:-false}"
      BAREUN_API_KEY: "${BAREUN_API_KEY:-}"
      BAREUN_API_URL: "${BAREUN_API_URL:-https://api.bareun.ai}"
    volumes:
      - ./ai-service/models/prompt-diagnosis:/app/models/prompt-diagnosis:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/promptune
      SPRING_DATASOURCE_USERNAME: promptune
      SPRING_DATASOURCE_PASSWORD: promptune
      AI_SERVICE_URL: http://ai-service:8000
      APP_FRONTEND_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-dummy-client-id}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-dummy-client-secret}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-dummy-client-id}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-dummy-client-secret}
      JWT_SECRET: ${JWT_SECRET:-promptune-dev-secret-key-change-in-production-please}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
